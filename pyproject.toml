[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solvent-agent"
version = "0.1.0"
authors = [
  { name="Solvent", email="author@solvent.com" },
]
description = "A virtual agent for software development."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { text = "MIT" }
dependencies = [
    "stripe>=9.0.0",
    "rich>=13.0.0",
    "pytest>=7.0.0"
]

[project.optional-dependencies]
serve = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0"]
telegram = ["python-telegram-bot>=21.0"]

[tool.setuptools.packages.find]
include = ["solvent*"]
exclude = ["data*", "tests*"]

[project.urls]
"Homepage" = "https://github.com/Solvent-Agent/solvent-agent"
"Bug Tracker" = "https://github.com/Solvent-Agent/solvent-agent/issues"
