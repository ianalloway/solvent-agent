name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'ianalloway/solvent-agent' && github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify release tag and revision
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION=$(python -c 'from solvent import __version__; print(__version__)')
          [[ "$TAG" == "v$VERSION" ]]
          [[ "$GITHUB_REF" == "refs/tags/$TAG" ]]
          [[ $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install verified build tools
        run: python -m pip install --require-hashes --only-binary=:all: -r release-build.txt

      - name: Build package
        run: python -m build --no-isolation

      - name: Save packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
