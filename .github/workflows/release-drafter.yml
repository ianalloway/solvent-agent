name: Release Drafter

on:
  push:
    branches: [main]
  # Dry run on pull requests: validates .github/release-drafter.yml and logs
  # where the change would land, without writing a release.
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-drafter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create/update the draft release
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          dry-run: ${{ github.event_name == 'pull_request' }}
