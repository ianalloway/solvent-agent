name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,all]"
      - name: Run tests
        run: |
          python -m pytest tests/ -v

  core:
    name: zero-dependency core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install core + dev only (no optional extras)
        run: pip install -e ".[dev]"
      - name: Run tests
        # The core runs on the stdlib alone; optional-extra tests skip cleanly.
        run: python -m pytest -q

  build:
    name: build + install + CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Install the built wheel and smoke-test the CLI
        run: |
          pip install dist/*.whl
          solvent --version
          solvent help
          solvent finance --json
